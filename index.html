<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Bump Music</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main id="player">
      <section id="artwork">
        <canvas id="waveform"></canvas>
        <div id="variant-badge">-</div>
        <p id="status">Tap play to start.</p>
      </section>

      <section id="sheet">
        <div class="track-row">
          <div id="current-note" class="track-title">-</div>
          <div id="current-chord" class="track-sub">-</div>
        </div>

        <div class="scrub">
          <div class="scrub-bar">
            <div id="scrub-fill" class="scrub-fill"></div>
          </div>
          <div class="scrub-labels">
            <span id="scrub-left"></span>
            <span id="scrub-right"></span>
          </div>
        </div>

        <div class="controls-row">
          <button
            id="record-btn"
            class="side-btn record"
            disabled
            aria-label="Record"
            title="Record"
          >
            <svg
              class="icon icon-record"
              viewBox="0 0 24 24"
              fill="currentColor"
              aria-hidden="true"
              focusable="false"
            >
              <circle cx="12" cy="12" r="6" />
            </svg>
          </button>

          <button id="main-btn" class="center-btn" aria-label="Play">
            <svg
              class="icon icon-play"
              viewBox="0 0 24 24"
              fill="currentColor"
              aria-hidden="true"
              focusable="false"
            >
              <path d="M8 5v14l11-7z" />
            </svg>
            <svg
              class="icon icon-pause is-hidden"
              viewBox="0 0 24 24"
              fill="currentColor"
              aria-hidden="true"
              focusable="false"
            >
              <rect x="6" y="5" width="4" height="14" rx="1" />
              <rect x="14" y="5" width="4" height="14" rx="1" />
            </svg>
          </button>

          <a
            id="download-link"
            class="side-btn download is-disabled"
            download
            aria-label="Download recording"
            title="Download recording"
          >
            <svg
              class="icon icon-download"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <path d="M12 4v10" />
              <path d="M7.5 10.5 12 15l4.5-4.5" />
              <path d="M5 19h14" />
            </svg>
          </a>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/tone@14/build/Tone.js"></script>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
